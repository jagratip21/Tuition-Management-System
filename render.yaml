databases:
  - name: tuition-management-db
    plan: free
    databaseName: tuition_management
    user: tuition_user

services:
  - type: web
    name: tuition-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuition-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
